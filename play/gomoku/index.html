<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku - Tabspace Playables</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6D00',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        * {
            font-weight: 700 !important;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
        }

        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playables-hover:hover {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 16px 2px rgba(34, 197, 94, 0.45) !important;
        }

        .cta-btn-green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #000000 !important;
            border: 1px solid #22c55e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cta-btn-green:hover {
            background: #121212 !important;
            color: var(--glow-orange) !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 22px 4px rgba(34, 197, 94, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        /* Modal Overlay Animation - Appended inside full-screen container */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Ensures native full-screen mode covers background properly with theme colors */
        #game-container:fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-webkit-full-screen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        #game-container:-ms-fullscreen {
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">
                <div onclick="playSound('click')" class="flex items-center shrink-0 py-1 group cursor-pointer" aria-label="Tabspace Playables Logo">
                    <img src="../../images/logo.png" alt="Tabspace Presentations Logo" class="h-16 md:h-20 w-auto object-contain block opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ Gomoku</span>
            </div>
            <nav class="hidden md:flex items-center gap-3 text-base">
                <a href="../../" class="btn-card playables-hover text-white px-5 py-2.5 text-sm">Back to Playables</a>
            </nav>
        </div>
    </header>

    <!-- MAIN GAME CONTAINER (Target for Fullscreen & Houses the Modal) -->
    <main id="game-container" class="w-full px-6 py-6 space-y-4 max-w-xl mx-auto flex-grow flex flex-col items-center justify-center relative bg-zinc-950">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl md:text-3xl tracking-tight text-white">Gomoku</h1>
            <p id="game-status" class="text-zinc-400 text-xs md:text-sm">Connect 5 stones in a row to win against the computer!</p>
        </div>

        <!-- Difficulty Controls Only -->
        <div class="flex items-center gap-2 bg-zinc-900/60 p-1.5 rounded-xl border border-zinc-800">
            <button onclick="setDifficulty('easy')" id="btn-easy" class="px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all">Easy</button>
            <button onclick="setDifficulty('medium')" id="btn-medium" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Medium</button>
            <button onclick="setDifficulty('hard')" id="btn-hard" class="px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all">Hard</button>
        </div>

        <!-- Board Grid (11x11 Gomoku with larger dimensions) -->
        <div id="gomoku-board" class="grid grid-cols-11 w-full max-w-[480px] aspect-square card-section p-2 bg-zinc-900 gap-[2px] bg-zinc-700 border border-zinc-700">
            <!-- Dynamically generated via JS -->
        </div>

        <!-- Action Controls: Restart & Fullscreen -->
        <div class="flex items-center gap-3 pt-2">
            <button onclick="resetGame()" class="cta-btn-green px-6 py-2.5 text-sm">Restart Game</button>
            <button onclick="toggleFullscreen()" id="fullscreen-btn" class="btn-card playables-hover text-white px-4 py-2.5 text-sm flex items-center gap-1.5">
                <span>Fullscreen</span> ⛶
            </button>
        </div>

        <!-- RESULT POPUP MODAL -->
        <div id="result-modal" class="absolute inset-0 z-50 flex items-center justify-center modal-backdrop hidden rounded-xl">
            <div class="card-section p-8 max-w-sm w-full mx-4 text-center space-y-6 bg-zinc-900 border border-zinc-700 shadow-2xl">
                <h2 id="modal-title" class="text-2xl md:text-3xl text-white tracking-wide">Game Over</h2>
                <p id="modal-message" class="text-zinc-300 text-base">Result message goes here</p>
                <div>
                    <button onclick="closeModalAndReset()" class="cta-btn-green px-8 py-3 text-base w-full">Play Again</button>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="py-6 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- GAME LOGIC & AUDIO SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                osc.frequency.setValueAtTime(900, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'draw') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(200, now + 0.3);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Fullscreen Toggle Logic
        function toggleFullscreen() {
            playSound('click');
            const elem = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        document.addEventListener("fullscreenchange", () => {
            const btn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                btn.innerHTML = "<span>Exit</span> 🗗";
            } else {
                btn.innerHTML = "<span>Fullscreen</span> ⛶";
            }
        });

        const BOARD_SIZE = 11;
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
        let isGameActive = true;
        let difficulty = 'easy';
        let isAiTurn = false;

        const boardElement = document.getElementById('gomoku-board');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const statusDisplay = document.getElementById('game-status');

        function setDifficulty(level) {
            playSound('click');
            difficulty = level;
            ['easy', 'medium', 'hard'].forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === level) {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm bg-brand-green text-black transition-all font-bold";
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-xs md:text-sm text-zinc-400 hover:text-white transition-all";
                }
            });
            resetGame();
        }

        function resetGame() {
            playSound('click');
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
            isGameActive = true;
            isAiTurn = false;
            statusDisplay.textContent = "Your turn (Black Stone)";
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('button');
                    let classes = "w-full aspect-square flex items-center justify-center bg-zinc-800 border border-zinc-700 rounded transition-all focus:outline-none hover:bg-zinc-700";
                    
                    cell.className = classes;
                    cell.onclick = () => makeMove(r, c);

                    if (board[r][c] === 'X') {
                        const stone = document.createElement('div');
                        stone.className = "w-4/5 h-4/5 rounded-full bg-white shadow-md border border-zinc-400";
                        cell.appendChild(stone);
                    } else if (board[r][c] === 'O') {
                        const stone = document.createElement('div');
                        stone.className = "w-4/5 h-4/5 rounded-full bg-zinc-950 shadow-md border border-zinc-600";
                        cell.appendChild(stone);
                    }

                    boardElement.appendChild(cell);
                }
            }
        }

        function makeMove(r, c) {
            if (board[r][c] !== '' || !isGameActive || isAiTurn) return;

            board[r][c] = 'X'; // Player
            playSound('click');
            renderBoard();

            if (checkWin('X')) {
                endGame('X');
                return;
            }
            if (checkDraw()) {
                endGame('draw');
                return;
            }

            isAiTurn = true;
            statusDisplay.textContent = "Computer is thinking...";
            setTimeout(aiMove, 400);
        }

        function aiMove() {
            if (!isGameActive) return;

            let move;
            if (difficulty === 'easy') {
                move = getRandomMove();
            } else if (difficulty === 'medium') {
                move = getMediumMove() || getRandomMove();
            } else {
                move = getBestMove() || getRandomMove();
            }

            if (move) {
                board[move.r][move.c] = 'O'; // AI
                playSound('click');
            }

            renderBoard();

            if (checkWin('O')) {
                endGame('O');
                return;
            }
            if (checkDraw()) {
                endGame('draw');
                return;
            }

            isAiTurn = false;
            statusDisplay.textContent = "Your turn (Black Stone)";
        }

        function getRandomMove() {
            let emptyCells = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') emptyCells.push({r, c});
                }
            }
            if (emptyCells.length === 0) return null;
            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        function getMediumMove() {
            return findWinningOrBlockingMove('O') || findWinningOrBlockingMove('X');
        }

        function getBestMove() {
            let best = getMediumMove();
            if (best) return best;

            let scoredCells = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') {
                        let score = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== '') {
                                    score += 2;
                                }
                            }
                        }
                        scoredCells.push({r, c, score});
                    }
                }
            }
            scoredCells.sort((a, b) => b.score - a.score);
            return scoredCells.length > 0 ? {r: scoredCells[0].r, c: scoredCells[0].c} : getRandomMove();
        }

        function findWinningOrBlockingMove(player) {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') {
                        board[r][c] = player;
                        let won = checkWin(player);
                        board[r][c] = '';
                        if (won) return {r, c};
                    }
                }
            }
            return null;
        }

        function checkWin(player) {
            const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] !== player) continue;
                    for (let [dr, dc] of dirs) {
                        let count = 0;
                        for (let i = 0; i < 5; i++) {
                            let nr = r + dr * i, nc = c + dc * i;
                            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) {
                                count++;
                            } else {
                                break;
                            }
                        }
                        if (count === 5) return true;
                    }
                }
            }
            return false;
        }

        function checkDraw() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') return false;
                }
            }
            return true;
        }

        function endGame(result) {
            isGameActive = false;
            if (result === 'X') {
                modalTitle.textContent = "You Win!";
                modalMessage.textContent = "Amazing job connecting 5 stones!";
                playSound('win');
            } else if (result === 'O') {
                modalTitle.textContent = "Computer Wins!";
                modalMessage.textContent = "Better luck next time! Try an easier difficulty.";
                playSound('lose');
            } else {
                modalTitle.textContent = "It's a Draw!";
                modalMessage.textContent = "The board is full with no winner.";
                playSound('draw');
            }
            resultModal.classList.remove('hidden');
            statusDisplay.textContent = "Game Over";
        }

        function closeModalAndReset() {
            playSound('click');
            resultModal.classList.add('hidden');
            resetGame();
        }

        resetGame();
    </script>
</body>
</html>
